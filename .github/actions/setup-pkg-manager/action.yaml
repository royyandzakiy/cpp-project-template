name: Setup Package Manager
description: 'Installs vcpkg + Conan (non-Linux; scripts/setup-ubuntu.sh covers Linux) and restores their binary caches'
inputs:
  os:
    required: true
  preset:
    description: 'Configure preset — part of the cache key, since presets differ in compiler/triplet'
    required: true
runs:
  using: composite
  steps:
    # ── vcpkg (all OSes) ───────────────────────────────────
    - name: Clone vcpkg (non-Linux)
      if: inputs.os != 'linux'
      shell: bash
      run: |
        if [ ! -d "$HOME/vcpkg" ]; then
          git clone https://github.com/Microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
        echo "$HOME/vcpkg" >> "$GITHUB_PATH"

    # Cache vcpkg's built packages, not the vcpkg checkout: a fresh clone is quick, rebuilding deps isn't.
    - name: Point vcpkg at a cacheable binary cache
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-cache
        key: vcpkg-${{ inputs.preset }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ inputs.preset }}-

    # ── Conan (all OSes) ────────────────────────────────────
    - name: Install Conan (non-Linux)
      if: inputs.os != 'linux'
      shell: bash
      run: |
        if ! command -v conan >/dev/null 2>&1; then
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        conan profile detect --force

    - name: Cache Conan
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-${{ inputs.preset }}-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-${{ inputs.preset }}-
